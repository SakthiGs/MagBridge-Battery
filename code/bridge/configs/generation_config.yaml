# =============================================================================
# MagBridge-Battery v1.0 Generation Config
# =============================================================================
# This config is LOCKED for v1.0. Changing any value invalidates the
# generated dataset and requires a new version bump.
#
# Reproducibility: every sample produced with this config + the bridge
# code at the corresponding commit hash + the listed input data hashes
# must be byte-identical.
# =============================================================================

dataset:
  name: "MagBridge-Battery"
  version: "1.0"
  chemistry: "LFP"
  description: >
    Synthetic magnetic-signature dataset for lithium-iron-phosphate cells,
    generated by bridging the Mohammadi-Jerschow OSF magnetic-morphology
    archive with PulseBat electrochemical degradation labels.

bridge:
  version: "v1.3"
  # Tested values from the v1.3 ablation runs that produced:
  #   - A2 falsifier passes (R^2 collapses on shuffled labels)
  #   - A1 ~= A0 (architectural finding, documented honestly)
  # DO NOT TUNE for v1.0 release.
  qrec_drift_strength: 800.0
  cone_half_angle_deg: 75.0
  decode_k: 8
  decode_kernel_sigma: 50.0
  amplitude_strength: 0.30
  spectral_strength: 0.05
  sensor_noise_fraction: 0.05
  soc_fluctuation_strength: 0.04
  cone_min_candidates: 8
  cone_disable_below_delta: 0.02

generation:
  # Sample counts (final, locked)
  # Clean samples: 560 PulseBat records (56 cells x 10 SOC levels)
  # generate 10 noise variants each, yielding 5,600 total. Each variant shares
  # the same (cell, SOC, SOH, U-features) but uses an independent generation
  # seed, producing different bridge randomness (morphology jitter, amplitude
  # noise, sensor noise, SOC fluctuation). Models "same cell measured 10 times
  # with independent sensor noise realizations."
  n_clean_variants_per_record: 10
  n_clean_grounded_samples: 5600   # = 560 records x 10 variants
  n_synthetic_anomaly_samples: 600
  n_regime_b_extrapolation_samples: 560
  total_expected_samples: 6760

  # Anomaly handling policy
  synthetic_anomaly_parent_policy: "grounded_clean_only"
  anomaly_pairing: "augment_clean_with_anomalous_derivative"
  # Exactly one active anomaly subtype per anomalous sample.
  # Anomalies are NEVER stacked.
  one_active_subtype_invariant: true

  # Severity sampling for synthetic anomalies
  anomaly_severity_distribution: "uniform"
  anomaly_severity_min: 0.2
  anomaly_severity_max: 1.0

  # Master RNG seed for the entire dataset generation.
  # Per-sample seeds are derived deterministically from this + sample identity.
  rng_seed: 20260512

# Synthetic-anomaly subtype counts (must sum to n_synthetic_anomaly_samples)
anomaly_subtypes:
  sensor_dropout: 150
  calibration_drift: 150
  temporal_warp: 150
  periodic_interference: 150

# Regime-B (bridge-extrapolation) anomaly config
regime_b:
  subtype: "low_voltage_regime_B"
  origin: "bridge_extrapolation"
  n_samples: 560
  voltage_range: [2.54, 3.06]  # extrapolation regime per Phase 2 cross-data analysis

# Signal layout (fixed, validated)
# Channels:
#   B_s1Y, B_s1Z: sensor 1 Y/Z components of magnetic field (nT, signed)
#   B_s2Y, B_s2Z: sensor 2 Y/Z components (nT, signed)
#   B_s1C5, B_s2C6: 5th and 6th channels from the OSF source data. Originally
#     labelled "Mag" in OSF but values can be negative — we name them "C5" /
#     "C6" to avoid implying a strict magnitude (sqrt(Y^2+Z^2)) interpretation.
signal:
  n_timesteps: 100
  n_channels: 6
  channel_names: ["B_s1Y", "B_s1Z", "B_s2Y", "B_s2Z", "B_s1C5", "B_s2C6"]
  dtype: "float32"
  # time_norm is always the uniform axis [0, 1/(T-1), ..., 1]. For
  # temporal_warp anomalies, the time axis stays uniform but the signal is
  # resampled at jittered timepoints (so the anomaly is detectable in signal).
  time_axis_field: "time_norm"

# By-cell split (primary)
splits:
  primary:
    type: "by_cell"
    n_train_cells: 39
    n_val_cells: 8
    n_test_cells: 9
    rng_seed: 42
    stratify_by: null  # cells are not stratified; SOH distributions overlap

  secondary:
    type: "by_record"
    train_frac: 0.7
    val_frac: 0.15
    test_frac: 0.15
    rng_seed: 42
    # NOTE: The actual warning written to by_record_optimistic_baseline.json
    # is the BY_RECORD_WARNING constant in src/magbridge/splits.py (longer and
    # mentions both within-cell AND parent-child leakage). This short field is
    # a documentation marker only — splits.py is the source of truth.
    warning: >
      By-record splits have TWO leakage sources: (1) within-cell leakage —
      samples from the same physical cell can appear in both train and test;
      and (2) parent-child leakage — synthetic anomalies and their clean
      parents can land in different splits. Together these inflate apparent
      performance by 5-15 percentage points. Use primary (by-cell) split for
      benchmark reporting. See splits.py:BY_RECORD_WARNING for full text.

# Provenance hashes (filled at generation time; placeholders here)
provenance:
  osf_data_hash: "TBD_AT_GENERATION"
  pulsebat_data_hash: "TBD_AT_GENERATION"
  bridge_code_commit: "TBD_AT_GENERATION"
  config_hash: "TBD_AT_GENERATION"

# Licensing
license:
  dataset: "CC-BY-4.0"
  code: "Apache-2.0"
